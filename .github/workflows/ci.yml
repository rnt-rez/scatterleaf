name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ScatterLeaf QA & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix worker ci

      - name: Build Web Component
        run: npm run build

      - name: Typecheck Edge Broker
        run: npm run worker:typecheck

      - name: Audit DevSecOps Sentinel
        run: npm run audit:security
